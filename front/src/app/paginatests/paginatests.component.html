<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Tests por Realizar</title>
    <link rel="stylesheet" href="paginatests.component.scss">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <nav class="navbar">
        <div class="logo-container">
          <span class="logo-text">Bienvenido, {{ username }}</span>
        </div>
        <!-- Navegación -->
        <ul class="nav-links">
          <li><a href="/inicio">Inicio</a></li>
          <li><a href="/inicio">Mi perfil</a></li>
          <li><a href="/login" (click)="cerrarSesion()">Cerrar sesión</a></li>
          
        </ul>
      </nav>
    </header>
      
      <main>
        <section class="tarjeta">
          <h2>Tests por Realizar</h2>
          <!-- Contenedor de tests -->
          <div class="test-lista">
            <!-- Iterar sobre los tests disponibles -->
            <div class="test" *ngFor="let test of tests">
              <div class="info-test">
                <p>{{test.type}}</p>
                <div class="especificaciones">
                  <span class="tiempo"><i class="fas fa-clock"></i> {{ test.duration }}</span>
                  <span
                    class="dificultad"
                    [ngClass]="{
                      'dificultad-dificil': test.complexity === 'Difícil',
                      'dificultad-medio': test.complexity === 'Medio',
                      'dificultad-facil': test.complexity === 'Fácil'
                    }"
                  >{{ test.complexity }}
                  </span>
                </div>
              </div>
              <button (click)="realizarTest(test.id)">Realizar Test</button>
            </div>
      
            <!-- Si no hay tests disponibles, muestra este mensaje -->
            <div class="sin-tests" *ngIf="tests.length === 0">
              <p>¡Felicidades! Ya has realizado todos los tests.</p>
            </div>
          </div>
          <button class="volver" onclick="history.back()">Volver</button>
        </section>
      </main>
      
      
      <footer>
        <p>&copy; 2025 TFG - Todos los derechos reservados</p>
      </footer>
      

    
</body>
</html>
